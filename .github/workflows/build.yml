name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to latest-stable rather than the documented minimum. The
      # app has only ever been built on Xcode 26.x, so validating an
      # older floor would mean chasing a 10-version gap for no benefit —
      # if the supported floor ever matters, test it deliberately rather
      # than discovering it here.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - run: brew install xcodegen

      # xcodegen fails outright without this file ("invalid config file
      # path") because project.yml references it for both configs, and
      # it's gitignored since it holds a per-developer team id. The
      # placeholder team inside is harmless with signing disabled.
      - name: Stub signing config
        run: cp signing.xcconfig.example signing.xcconfig

      - run: xcodegen

      # No signing in CI: there's no certificate and no team, and the
      # distribution model is that each developer signs their own copy.
      # This proves the code compiles, not that it can be shipped.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project ClaudeProjectHub.xcodeproj \
            -scheme ClaudeProjectHub \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  scripts:
    name: Launch scripts compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # osacompile resolves app-specific terminology out of the target
      # app's scripting dictionary, so iterm2.applescript cannot compile
      # without iTerm2 present ("create window with default profile" is a
      # syntax error otherwise). It's the one bundled script that leans on
      # a real dictionary, and the one worth paying a cask download for —
      # Terminal is preinstalled, VSCode exposes no dictionary at all, and
      # the JetBrains scripts drive their IDEs through System Events.
      #
      # Best-effort on purpose: if any of this breaks, the canary below
      # tells check-scripts.sh to skip iterm2.applescript rather than fail.
      # The first attempt at this did fail — the cask installed the bundle
      # but osacompile still couldn't load its dictionary, and a disk check
      # can't tell those apart, so measure it instead of assuming.
      - name: Install iTerm2 (for its scripting dictionary)
        continue-on-error: true
        run: |
          brew install --cask iterm2 || true
          # A freshly copied bundle isn't necessarily known to Launch
          # Services, which is how AppleScript resolves an app by name.
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          [[ -x "$LSREG" ]] && "$LSREG" -f /Applications/iTerm.app || true

      # Compile-only probe of the exact construct that needs the
      # dictionary. osacompile never executes, so this can't start iTerm2.
      - name: Probe iTerm2 terminology
        run: |
          if osacompile -o /dev/null \
               -e 'tell application "iTerm" to create window with default profile' 2>/dev/null; then
            echo "iTerm2 terminology resolves — iterm2.applescript will be checked."
          else
            echo "CPH_SCRIPT_CHECK_NO_DICT=iTerm" >> "$GITHUB_ENV"
            echo "::warning::iTerm2 scripting dictionary unavailable on this runner; iterm2.applescript will be reported as SKIP, not verified."
          fi

      # Covers something a local build never does: a syntax error in a
      # host's .applescript otherwise surfaces only when a user launches
      # a session into that host.
      - run: ./tools/check-scripts.sh

  docs:
    name: Doc links resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Broken #anchors render as a silent no-op on GitHub, so nothing
      # else catches them.
      - run: ./tools/check-doc-links.sh
