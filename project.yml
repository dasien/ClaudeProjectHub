name: ClaudeProjectHub
options:
  bundleIdPrefix: com.bgentry
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from signing.xcconfig (per-developer,
    # gitignored). See signing.xcconfig.example for setup instructions.
    # Xcode 16 "recommended settings" that xcodegen doesn't include by
    # default. Setting them here keeps the "Update to recommended settings"
    # prompt from reappearing on every regen.
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  ClaudeProjectHub:
    type: application
    platform: macOS
    configFiles:
      Debug: signing.xcconfig
      Release: signing.xcconfig
    sources:
      - path: Sources
      - path: Resources/Scripts
        type: folder
      - path: Resources/models.json
      - path: Resources/Assets.xcassets
      - path: README.md
        buildPhase: none
        group: Docs
      - path: CLAUDE.md
        buildPhase: none
        group: Docs
      - path: USER_GUIDE.md
        buildPhase: none
        group: Docs
      - path: INTEGRATIONS_GUIDE.md
        buildPhase: none
        group: Docs
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Claude Project Hub
        CFBundleIconName: AppIcon
        # Reference the build settings rather than literals. Without
        # these two keys xcodegen writes its own defaults (1.0 / 1) and
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION above are dead
        # config — the installed app reported "1.0" while project.yml
        # said 0.1.0. Bump the values in `settings.base` to release.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 bgentry"
        NSAppleEventsUsageDescription: "Claude Project Hub uses AppleScript to launch Claude in your chosen terminal application."
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bgentry.ClaudeProjectHub
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Resources/ClaudeProjectHub.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ClaudeProjectHub:
    build:
      targets:
        ClaudeProjectHub: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  ClaudeProjectHub (Release):
    build:
      targets:
        ClaudeProjectHub: all
    run:
      config: Release
    archive:
      config: Release
