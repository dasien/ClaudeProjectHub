name: ClaudeProjectHub
options:
  bundleIdPrefix: com.bgentry
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "G5GR8NMG5U"
    # Xcode 16 "recommended settings" that xcodegen doesn't include by
    # default. Setting them here keeps the "Update to recommended settings"
    # prompt from reappearing on every regen.
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  ClaudeProjectHub:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Scripts
        type: folder
      - path: Resources/models.json
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Claude Project Hub
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 bgentry"
        NSAppleEventsUsageDescription: "Claude Project Hub uses AppleScript to launch Claude in your chosen terminal application."
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bgentry.ClaudeProjectHub
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Resources/ClaudeProjectHub.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ClaudeProjectHub:
    build:
      targets:
        ClaudeProjectHub: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
